name: "Infracost Scan"
description: "Scan infrastructure code for cost changes, post a PR comment, and manage PR status in the Infracost dashboard."

inputs:
  api-key:
    description: "Infracost API key for authentication."
    required: true
  base-path:
    description: "Path to the base branch checkout. Required for scanning (not needed when only updating PR status)."
    required: false
  head-path:
    description: "Path to the head (PR) branch checkout. Required for scanning (not needed when only updating PR status)."
    required: false
  version:
    description: "Version of the scanner to use (e.g. 0.1.0). Defaults to latest."
    required: false
    default: "latest"
  project:
    description: "Filter scanning to a single project."
    required: false
  pr-status:
    description: "Explicitly set the PR status (OPEN, MERGED, CLOSED). If not set, derived automatically from the GitHub event context."
    required: false
  github-token:
    description: "GitHub API token for posting PR comments."
    required: false
    default: ${{ github.token }}
  github-owner:
    description: "Override the GitHub repository owner derived from repo-url. github.com only."
    required: false
  github-repo:
    description: "Override the GitHub repository name derived from repo-url. github.com only."
    required: false
  pr-number:
    description: "Pull request number to comment on. Defaults to the current PR."
    required: false
  repo-url:
    description: "Repository URL. Selects the repository the comment is posted to and the source links, so github-token needs write access to it. Defaults to the current repository."
    required: false

runs:
  using: composite
  steps:
    # No token: infracost/ci releases are public and checksummed. The base URL
    # is hardcoded — a composite step inherits the caller job's env:, so an
    # INFRACOST_SCANNER_BASE_URL override would redirect the download.
    - name: Download scanner
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        RELEASES="https://github.com/infracost/ci/releases"

        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$OS" in
          linux|darwin) ;;
          *) echo "::error::Unsupported scanner operating system: ${OS}"; exit 1 ;;
        esac
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "::error::Unsupported scanner architecture: ${ARCH}"; exit 1 ;;
        esac

        # Resolved to a concrete tag first: latest/download is a redirect
        # evaluated per request, so the archive and checksums.txt fetched
        # through it could straddle a release and fail the checksum.
        if [ "$VERSION" = "latest" ]; then
          if ! TAG=$(curl -fsS --connect-timeout 10 --max-time 120 -o /dev/null -w '%{redirect_url}' "${RELEASES}/latest"); then
            echo "::error::Could not resolve the latest infracost-scanner release from ${RELEASES}/latest"
            exit 1
          fi
          TAG="${TAG##*/}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Could not resolve the latest infracost-scanner release from ${RELEASES}/latest"; exit 1 ;;
          esac
        else
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a semantic version, optionally prefixed with v"
            exit 1
          fi
          TAG="v${VERSION#v}"
        fi

        ARCHIVE="infracost-scanner_${OS}_${ARCH}.tar.gz"
        DEST="${RUNNER_TEMP}/infracost-scanner"
        SHA=$(command -v sha256sum || echo "shasum -a 256")   # macOS has no sha256sum

        # -o into RUNNER_TEMP, never the CWD: a composite step runs in
        # GITHUB_WORKSPACE, which here is a checkout the scanner is about to read.
        STATUS=0
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "${RUNNER_TEMP}/${ARCHIVE}" "${RELEASES}/download/${TAG}/${ARCHIVE}" || STATUS=$?
        if [ "$STATUS" -ne 0 ]; then
          echo "::error::Could not download scanner archive from ${RELEASES}/download/${TAG}/${ARCHIVE} (curl exit ${STATUS})"
          exit 1
        fi

        # set -e stops an unverified archive reaching tar. grep | $SHA fails
        # closed when the asset is absent from checksums.txt: both sha256sum
        # and shasum exit non-zero on empty input.
        curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "${RUNNER_TEMP}/checksums.txt" "${RELEASES}/download/${TAG}/checksums.txt"
        (cd "$RUNNER_TEMP" && grep " ${ARCHIVE}$" checksums.txt | $SHA -c -)

        tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "$RUNNER_TEMP"
        chmod +x "$DEST"
        echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

    # Only the status is derived here. The VCS contract is repeated in each
    # step's env: GITHUB_ENV would export it to the whole caller job.
    - name: Derive pull request status
      id: context
      shell: bash
      env:
        INPUT_PR_STATUS: ${{ inputs.pr-status }}
        INPUT_BASE_PATH: ${{ inputs.base-path }}
        INPUT_HEAD_PATH: ${{ inputs.head-path }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_PR_MERGED: ${{ github.event.pull_request.merged }}
      run: |
        set -euo pipefail

        PR_STATUS="$INPUT_PR_STATUS"
        if [ -z "$PR_STATUS" ] && [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$EVENT_ACTION" = "closed" ]; then
            if [ "$EVENT_PR_MERGED" = "true" ]; then
              PR_STATUS="MERGED"
            else
              PR_STATUS="CLOSED"
            fi
          else
            PR_STATUS="OPEN"
          fi
        fi

        # Rejected rather than escaped: only these values are ever written to
        # GITHUB_OUTPUT, so nothing caller-supplied can forge a line.
        case "$PR_STATUS" in
          ""|OPEN|MERGED|CLOSED) ;;
          *)
            echo "::error::pr-status must be OPEN, MERGED or CLOSED"
            exit 1
            ;;
        esac

        # Scanning is the default, so events other than pull_request still
        # scan. A derived closed PR has nothing to compare, but an explicit
        # pr-status is the caller's override and only the checkout stops it.
        SCAN=true
        if [ -z "$INPUT_PR_STATUS" ] && { [ "$PR_STATUS" = "MERGED" ] || [ "$PR_STATUS" = "CLOSED" ]; }; then
          SCAN=false
        fi
        if [ -z "$INPUT_BASE_PATH" ] || [ -z "$INPUT_HEAD_PATH" ]; then
          SCAN=false
        fi

        printf 'pr_status=%s\n' "$PR_STATUS" >> "$GITHUB_OUTPUT"
        printf 'scan=%s\n' "$SCAN" >> "$GITHUB_OUTPUT"
        echo "Infracost pull request status: ${PR_STATUS:-none}, scan: ${SCAN}"

    - name: Run scanner
      if: steps.context.outputs.scan == 'true'
      shell: bash
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ inputs.api-key }}
        INFRACOST_CLI_LOG_LEVEL: info
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INFRACOST_VCS_PROVIDER: github
        INFRACOST_VCS_REPOSITORY_URL: ${{ inputs.repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        INFRACOST_VCS_PULL_REQUEST_ID: ${{ inputs.pr-number || github.event.pull_request.number }}
        INFRACOST_VCS_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        INFRACOST_VCS_PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
        INFRACOST_VCS_PULL_REQUEST_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        INFRACOST_VCS_BRANCH: ${{ github.event.pull_request.head.ref }}
        INFRACOST_VCS_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        INFRACOST_VCS_PIPELINE_RUN_ID: ${{ github.run_id }}
        # Blanked, not omitted: a caller job's env: block is inherited here and
        # would otherwise outrank what the action derives from the event.
        INFRACOST_VCS_PULL_REQUEST_URL: ''
        INFRACOST_VCS_PULL_REQUEST_STATUS: ''
        INFRACOST_VCS_COMMIT_SHA: ''
        INFRACOST_VCS_COMMIT_MESSAGE: ''
        INFRACOST_VCS_COMMIT_AUTHOR_NAME: ''
        INFRACOST_VCS_COMMIT_AUTHOR_EMAIL: ''
        INFRACOST_VCS_COMMIT_TIMESTAMP: ''
        INPUT_BASE_PATH: ${{ inputs.base-path }}
        INPUT_HEAD_PATH: ${{ inputs.head-path }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_GITHUB_OWNER: ${{ inputs.github-owner }}
        INPUT_GITHUB_REPO: ${{ inputs.github-repo }}
      run: |
        if [ -z "$INPUT_BASE_PATH" ] || [ -z "$INPUT_HEAD_PATH" ]; then
          echo "::error::base-path and head-path are required for scanning."
          exit 1
        fi

        ARGS=(diff --base-path "$INPUT_BASE_PATH" --head-path "$INPUT_HEAD_PATH")
        if [ -n "$INPUT_GITHUB_OWNER" ]; then
          ARGS+=(--github-owner "$INPUT_GITHUB_OWNER")
        fi
        if [ -n "$INPUT_GITHUB_REPO" ]; then
          ARGS+=(--github-repo "$INPUT_GITHUB_REPO")
        fi
        if [ -n "$INPUT_PROJECT" ]; then
          ARGS+=(--project "$INPUT_PROJECT")
        fi

        infracost-scanner "${ARGS[@]}"

    # The same repository URL and PR ID expressions as above: the dashboard is
    # keyed on the PR URL built from them, so the two steps must agree.
    - name: Update PR status
      if: steps.context.outputs.pr_status != ''
      shell: bash
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ inputs.api-key }}
        INFRACOST_CLI_LOG_LEVEL: info
        INFRACOST_VCS_PROVIDER: github
        INFRACOST_VCS_REPOSITORY_URL: ${{ inputs.repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        INFRACOST_VCS_PULL_REQUEST_ID: ${{ inputs.pr-number || github.event.pull_request.number }}
        INFRACOST_VCS_PULL_REQUEST_STATUS: ${{ steps.context.outputs.pr_status }}
        # Blanked for the same reason as the scan step: the inherited value
        # would key the status to a different pull request.
        INFRACOST_VCS_PULL_REQUEST_URL: ''
      run: infracost-scanner status
