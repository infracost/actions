name: "Infracost Scan"
description: "Scan infrastructure code and upload baseline cost data to the Infracost dashboard."

inputs:
  api-key:
    description: "Infracost API key for authentication."
    required: true
  path:
    description: "Path to the directory to scan."
    required: true
  version:
    description: "Tag of the ghcr.io/infracost/ci image to run (e.g. 2, 2.0.1, latest, or sha256:<digest>). Must be 2.0.0 or later."
    required: false
    default: "2"
  project:
    description: "Filter scanning to a single project."
    required: false
  repo-url:
    description: "Repository URL for metadata."
    required: false

runs:
  using: composite
  steps:
    - name: Resolve image tag
      id: image
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        write_output() {
          local name="$1"
          local value="$2"
          local delimiter
          delimiter="ghadelimiter_${RANDOM}_${RANDOM}_${RANDOM}_${RANDOM}"

          {
            printf '%s<<%s\n' "$name" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        }

        IMAGE="ghcr.io/infracost/ci"
        case "$VERSION" in
          "")
            echo "::error::version must be a ghcr.io/infracost/ci tag or sha256: digest"
            exit 1
            ;;
          sha256:*)
            REF="${IMAGE}@${VERSION}"
            ;;
          latest)
            REF="${IMAGE}:latest"
            ;;
          *)
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::version ${VERSION} is not a ghcr.io/infracost/ci tag. Use a numeric tag (2, 2.0, 2.0.1), latest, or sha256:<digest>."
              exit 1
            fi
            # Below 2.0.0 is pre-launch in infracost/ci, and the same numbers
            # name a different build under @v4. Digits, not -lt: a 20-digit
            # major overflows [ and the comparison errors instead of failing.
            MAJOR="${VERSION%%.*}"
            MAJOR="${MAJOR#"${MAJOR%%[!0]*}"}"
            if [ -z "$MAJOR" ] || { [ "${#MAJOR}" -eq 1 ] && [ "$MAJOR" -lt 2 ]; }; then
              echo "::error::version ${VERSION} is below 2.0.0, the oldest release v5 of this action runs. Use infracost/actions/scan@v4 for older scanner releases."
              exit 1
            fi
            REF="${IMAGE}:${VERSION}"
            ;;
        esac
        write_output "ref" "$REF"

    - name: Run scanner
      shell: bash
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ inputs.api-key }}
        INFRACOST_CLI_LOG_LEVEL: info
        INFRACOST_VCS_PROVIDER: github
        INFRACOST_VCS_REPOSITORY_URL: ${{ inputs.repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        INFRACOST_VCS_PIPELINE_RUN_ID: ${{ github.run_id }}
        # Blanked, not omitted: a caller job's env: block is inherited here and
        # would otherwise outrank what the action derives from the scanned path.
        INFRACOST_VCS_BRANCH: ''
        INFRACOST_VCS_COMMIT_SHA: ''
        INFRACOST_VCS_COMMIT_MESSAGE: ''
        INFRACOST_VCS_COMMIT_AUTHOR_NAME: ''
        INFRACOST_VCS_COMMIT_AUTHOR_EMAIL: ''
        INFRACOST_VCS_COMMIT_TIMESTAMP: ''
        IMAGE_REF: ${{ steps.image.outputs.ref }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROJECT: ${{ inputs.project }}
      run: |
        command -v docker >/dev/null || {
          echo "::error::v5 runs ghcr.io/infracost/ci and needs Docker on the runner. For macOS or Docker-less runners use the container: job or binary install documented in infracost/ci."
          exit 1
        }

        # Only the workspace is mounted, so a path outside it exists on the
        # runner but not in the container.
        WORKSPACE=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        # Resolved against the workspace, which is the container's workdir.
        RESOLVED=$(cd "$WORKSPACE" && cd "$INPUT_PATH" 2>/dev/null && pwd -P) || {
          echo "::error::path ${INPUT_PATH} does not exist."
          exit 1
        }
        case "$RESOLVED" in
          "$WORKSPACE"|"$WORKSPACE"/*) ;;
          *)
            echo "::error::path ${INPUT_PATH} is outside GITHUB_WORKSPACE, the only directory mounted into the container. Check it out under the workspace, or use the container: job documented in infracost/ci."
            exit 1
            ;;
        esac

        ARGS=(scan --path "$INPUT_PATH")

        if [ -n "$INPUT_PROJECT" ]; then
          ARGS+=(--project "$INPUT_PROJECT")
        fi

        # Bare -e passes the step's value through, blanks included, so the
        # inherited env the block above overrides stays overridden. v4 ran in
        # the runner process, so the parser inherited the rest of these.
        DOCKER_ENV=(-e GITHUB_ACTIONS)
        for name in "${!INFRACOST_@}" "${!TF_VAR_@}" "${!AWS_@}" \
          HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
          # The image bakes the plugin cache; a caller's leftover value points
          # it at a root-owned directory this non-root run cannot write.
          case "$name" in
            INFRACOST_CLI_PLUGIN_*) continue ;;
          esac
          DOCKER_ENV+=(-e "$name")
        done

        # Forwarded only with the host path mounted: the name on its own points
        # the container at a socket or file that is not there.
        if [ -S "${SSH_AUTH_SOCK:-}" ]; then
          DOCKER_ENV+=(-e SSH_AUTH_SOCK -v "${SSH_AUTH_SOCK}:${SSH_AUTH_SOCK}")
        fi
        if [ -f "${SSL_CERT_FILE:-}" ]; then
          DOCKER_ENV+=(-e SSL_CERT_FILE -v "${SSL_CERT_FILE}:${SSL_CERT_FILE}:ro")
        fi

        # --pull always: the default tag 2 is mutable, so a persistent runner's
        # cache must not decide what runs. --user: the image runs as root and a
        # root-owned file in the workspace breaks the caller's later steps.
        docker run --rm --pull always \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
          "${DOCKER_ENV[@]}" \
          "$IMAGE_REF" "${ARGS[@]}"
