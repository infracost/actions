name: Diff and scan actions
on:
  push:
    branches:
      - master
    paths:
      - diff/action.yml
      - scan/action.yml
      - scripts/testScannerActions.js
      - package.json
  pull_request:
    paths:
      - diff/action.yml
      - scan/action.yml
      - scripts/testScannerActions.js
      - package.json

defaults:
  run:
    shell: bash

jobs:
  action-context:
    name: Action context tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm run scanner-actions:test
